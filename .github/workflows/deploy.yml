name: Deploy to Vercel

# Alternative to Vercel's native Git integration.
# Enable it by adding a repository variable VERCEL_DEPLOY = true and the three
# secrets below (Settings → Secrets and variables → Actions):
#   - VERCEL_TOKEN       (Vercel → Account Settings → Tokens)
#   - VERCEL_ORG_ID      (from `.vercel/project.json` after `vercel link`, or project settings)
#   - VERCEL_PROJECT_ID  (same source)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # Stays inactive until you opt in with the VERCEL_DEPLOY repo variable,
    # so it never fails noisily before the secrets are configured.
    if: ${{ vars.VERCEL_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
